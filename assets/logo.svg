<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0d7a57" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Crescent Moon Symbol (Islamic Motif) -->
  <path d="M 285 105 A 130 130 0 1 0 380 270 A 105 105 0 1 1 285 105 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Ambulance Silhouette / Icon -->
  <g transform="translate(100, 165)" filter="url(#dropShadow)">
    <!-- Cabin Body -->
    <path d="M 20 180 L 20 70 A 20 20 0 0 1 40 50 L 190 50 A 15 15 0 0 1 205 65 L 205 180 Z" fill="#ffffff" />
    <path d="M 205 100 L 270 100 A 20 20 0 0 1 288 115 L 305 155 A 15 15 0 0 1 310 165 L 310 180 L 205 180 Z" fill="#f8fafc" />
    
    <!-- Emergency Light / Siren on Top -->
    <rect x="130" y="32" width="45" height="18" rx="6" fill="#ef4444" />
    <rect x="145" y="24" width="15" height="8" rx="2" fill="#3b82f6" />
    
    <!-- Ambulance Side Stripes (Green & Gold) -->
    <path d="M 20 115 L 305 115 L 305 130 L 20 130 Z" fill="#0d7a57" />
    <path d="M 20 133 L 305 133 L 305 142 L 20 142 Z" fill="url(#goldGrad)" />
    
    <!-- Medical Cross / Plus Badge on Body -->
    <circle cx="105" cy="85" r="26" fill="#0d7a57" />
    <rect x="98" y="68" width="14" height="34" rx="4" fill="#ffffff" />
    <rect x="88" y="78" width="34" height="14" rx="4" fill="#ffffff" />

    <!-- Windows -->
    <path d="M 215 110 L 265 110 A 10 10 0 0 1 274 118 L 285 145 L 215 145 Z" fill="#0284c7" opacity="0.85" />
    <rect x="150" y="62" width="45" height="35" rx="5" fill="#38bdf8" opacity="0.75" />

    <!-- Wheels -->
    <circle cx="75" cy="180" r="30" fill="#1e293b" />
    <circle cx="75" cy="180" r="16" fill="#94a3b8" />
    <circle cx="75" cy="180" r="6" fill="#0d7a57" />

    <circle cx="250" cy="180" r="30" fill="#1e293b" />
    <circle cx="250" cy="180" r="16" fill="#94a3b8" />
    <circle cx="250" cy="180" r="6" fill="#0d7a57" />

    <!-- Headlight -->
    <path d="M 305 155 L 312 155 A 4 4 0 0 1 316 159 L 316 172 A 4 4 0 0 1 312 176 L 305 176 Z" fill="#facc15" />
  </g>

  <!-- Typography at Bottom -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AMBULAN MAISYA</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">PONPES IMAM SYAFI'I BREBES</text>
</svg>
